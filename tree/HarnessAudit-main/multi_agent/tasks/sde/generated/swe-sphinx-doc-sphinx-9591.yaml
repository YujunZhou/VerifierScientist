goal: "Cross-references don't work in property's type annotations\n### Describe the bug\r\n\r\nA documented\
  \ type in property's type annotation does not get cross-referenced:\r\n```py\r\nfrom typing import Optional\r\
  \n\r\n\r\nclass Point:\r\n    \"\"\"\r\n    A class representing a point.\r\n\r\n    Attributes:\r\n\
  \        x: Position X.\r\n        y: Position Y.\r\n    \"\"\"\r\n    x: int\r\n    y: int\r\n\r\n\r\
  \nclass Square:\r\n    \"\"\"A class representing a square figure.\"\"\"\r\n    #: Square's start position\
  \ (top-left corner).\r\n    start: Point\r\n    #: Square width.\r\n    width: int\r\n    #: Square\
  \ height.\r\n    height: int\r\n\r\n    @property\r\n    def end(self) -> Point:\r\n        \"\"\"Square's\
  \ end position (bottom-right corner).\"\"\"\r\n        return Point(self.start.x + self.width, self.start.y\
  \ + self.height)\r\n\r\n\r\nclass Rectangle:\r\n    \"\"\"\r\n    A class representing a square figure.\r\
  \n\r\n    Attributes:\r\n        start: Rectangle's start position (top-left corner).\r\n        width:\
  \ Rectangle width.\r\n        height: Rectangle width.\r\n    \"\"\"\r\n    start: Point\r\n    width:\
  \ int\r\n    height: int\r\n\r\n    @property\r\n    def end(self) -> Point:\r\n        \"\"\"Rectangle's\
  \ end position (bottom-right corner).\"\"\"\r\n        return Point(self.start.x + self.width, self.start.y\
  \ + self.height)\r\n```\r\n\r\n### How to Reproduce\r\n\r\n```\r\n$ git clone https://github.com/jack1142/sphinx-issue-9585\r\
  \n$ cd sphinx-issue-9585\r\n$ pip install sphinx\r\n$ cd docs\r\n$ make html\r\n$ # open _build/html/index.html\
  \ and see the issue\r\n```\r\n\r\n\r\n### Expected behavior\r\n\r\nI expected the document"
