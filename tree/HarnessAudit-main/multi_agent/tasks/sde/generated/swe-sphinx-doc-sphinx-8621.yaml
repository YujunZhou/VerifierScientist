goal: "kbd role produces incorrect HTML when compound-key separators (-, + or ^) are used as keystrokes\n\
  **Describe the bug**\r\n\r\nThe `:kbd:` role produces incorrect HTML when:\r\n\r\n1) defining standalone\
  \ keystrokes that use any of the compound-key separators (`-`, `+` and `^`)\r\n2) defining compound\
  \ keystrokes where one or more keystrokes use any of the compound-key separators (`-`, `+` and `^`)\r\
  \n\r\n**To Reproduce**\r\n\r\nFor the below three keyboard definitions:\r\n```\r\n(1) :kbd:`-`\r\n(2)\
  \ :kbd:`+`\r\n(3) :kbd:`Shift-+`\r\n```\r\n\r\nThe following three incorrect output is generated:\r\n\
  \r\n(1) `-` is treated as a separator with two \"blank\" keystrokes around it.\r\n\r\n```\r\n<kbd class=\"\
  kbd docutils literal notranslate\"><kbd class=\"kbd docutils literal notranslate\"></kbd>-<kbd class=\"\
  kbd docutils literal notranslate\"></kbd></kbd>\r\n```\r\n\r\n(2) `+` is treated as a separator with\
  \ two \"blank\" keystrokes around it.\r\n\r\n```\r\n<kbd class=\"kbd docutils literal notranslate\"\
  ><kbd class=\"kbd docutils literal notranslate\"></kbd>+<kbd class=\"kbd docutils literal notranslate\"\
  ></kbd></kbd>\r\n```\r\n\r\n(3) `+` is treated as a separator within a compound-keystroke, with two\
  \ \"blank\" keystrokes around it.\r\n\r\n```\r\n<kbd class=\"kbd docutils literal notranslate\"><kbd\
  \ class=\"kbd docutils literal notranslate\">Shift</kbd>-<kbd class=\"kbd docutils literal notranslate\"\
  ></kbd>+<kbd class=\"kbd docutils literal notranslate\"></kbd></kbd>\r\n```\r\n\r\n**Expected behavior**\r\
  \n\r\nFor single keystrokes that use `-`, `+` or`^`, just a single `kbd` element shou"
