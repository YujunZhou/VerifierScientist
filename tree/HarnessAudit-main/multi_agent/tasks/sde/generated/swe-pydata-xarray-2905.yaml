fixture: pydata-xarray-2905
goal: "Variable.__setitem__ coercing types on objects with a values property\n#### Minimal example\r\n\
  ```python\r\nimport xarray as xr\r\n\r\ngood_indexed, bad_indexed = xr.DataArray([None]), xr.DataArray([None])\r\
  \n\r\nclass HasValues(object):\r\n    values = 5\r\n    \r\ngood_indexed.loc[{'dim_0': 0}] = set()\r\
  \nbad_indexed.loc[{'dim_0': 0}] = HasValues()\r\n\r\n# correct\r\n# good_indexed.values => array([set()],\
  \ dtype=object)\r\n\r\n# incorrect\r\n# bad_indexed.values => array([array(5)], dtype=object)\r\n```\r\
  \n#### Problem description\r\n\r\nThe current behavior prevents storing objects inside arrays of `dtype==object`\
  \ even when only performing non-broadcasted assignments if the RHS has a `values` property. Many libraries\
  \ produce objects with a `.values` property that gets coerced as a result.\r\n\r\nThe use case I had\
  \ in prior versions was to store `ModelResult` instances from the curve fitting library `lmfit`, when\
  \ fitting had be performed over an axis of a `Dataset` or `DataArray`.\r\n\r\n#### Expected Output\r\
  \n\r\nIdeally:\r\n```\r\n...\r\n# bad_indexed.values => array([< __main__.HasValues instance>], dtype=object)\r\
  \n```\r\n\r\n#### Output of ``xr.show_versions()``\r\n\r\nBreaking changed introduced going from `v0.10.0`\
  \ -> `v0.10.1` as a result of https://github.com/pydata/xarray/pull/1746, namely the change on line\
  \ https://github.com/fujiisoup/xarray/blob/6906eebfc7645d06ee807773f5df9215634addef/xarray/core/variable.py#L641.\r\
  \n\r\n<details>\r\nINSTALLED VERSIONS\r\n------------------\r\ncommit: None\r\npython: 3.5.4.final.0\r\
  \npython-bits: 64\r\nOS: D"
