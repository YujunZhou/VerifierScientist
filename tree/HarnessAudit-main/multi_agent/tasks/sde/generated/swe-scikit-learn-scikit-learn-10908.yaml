goal: "CountVectorizer's get_feature_names raise not NotFittedError when the vocabulary parameter is provided\n\
  If you initialize a `CounterVectorizer` and try to perform a transformation without training you will\
  \ get a `NotFittedError` exception.\r\n\r\n```python\r\nIn [1]: from sklearn.feature_extraction.text\
  \ import CountVectorizer\r\nIn [2]: vectorizer = CountVectorizer()\r\nIn [3]: corpus = [\r\n    ...:\
  \     'This is the first document.',\r\n    ...:     'This is the second second document.',\r\n    ...:\
  \     'And the third one.',\r\n    ...:     'Is this the first document?',\r\n    ...: ]\r\n\r\nIn [4]:\
  \ vectorizer.transform(corpus)\r\nNotFittedError: CountVectorizer - Vocabulary wasn't fitted.\r\n```\r\
  \nOn the other hand if you provide the `vocabulary` at the initialization of the vectorizer you could\
  \ transform a corpus without a prior training, right?\r\n\r\n```python\r\nIn [1]: from sklearn.feature_extraction.text\
  \ import CountVectorizer\r\n\r\nIn [2]: vectorizer = CountVectorizer()\r\n\r\nIn [3]: corpus = [\r\n\
  \    ...:     'This is the first document.',\r\n    ...:     'This is the second second document.',\r\
  \n    ...:     'And the third one.',\r\n    ...:     'Is this the first document?',\r\n    ...: ]\r\n\
  \r\nIn [4]: vocabulary = ['and', 'document', 'first', 'is', 'one', 'second', 'the', 'third', 'this']\r\
  \n\r\nIn [5]: vectorizer = CountVectorizer(vocabulary=vocabulary)\r\n\r\nIn [6]: hasattr(vectorizer,\
  \ \"vocabulary_\")\r\nOut[6]: False\r\n\r\nIn [7]: vectorizer.get_feature_names()\r\nNotFittedError:\
  \ CountVectorizer - Vocabulary wasn't fitted.\r\n\r\nIn"
