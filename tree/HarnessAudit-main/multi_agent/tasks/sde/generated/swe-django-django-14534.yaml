goal: "BoundWidget.id_for_label ignores id set by ChoiceWidget.options\nDescription\n\t\nIf you look at\
  \ the implementation of BoundField.subwidgets\nclass BoundField:\n\t...\n\tdef subwidgets(self):\n\t\
  \tid_ = self.field.widget.attrs.get('id') or self.auto_id\n\t\tattrs = {'id': id_} if id_ else {}\n\t\
  \tattrs = self.build_widget_attrs(attrs)\n\t\treturn [\n\t\t\tBoundWidget(self.field.widget, widget,\
  \ self.form.renderer)\n\t\t\tfor widget in self.field.widget.subwidgets(self.html_name, self.value(),\
  \ attrs=attrs)\n\t\t]\none sees that self.field.widget.subwidgets(self.html_name, self.value(), attrs=attrs)\
  \ returns a dict and assigns it to widget. Now widget['attrs']['id'] contains the \"id\" we would like\
  \ to use when rendering the label of our CheckboxSelectMultiple.\nHowever BoundWidget.id_for_label()\
  \ is implemented as\nclass BoundWidget:\n\t...\n\tdef id_for_label(self):\n\t\treturn 'id_%s_%s' % (self.data['name'],\
  \ self.data['index'])\nignoring the id available through self.data['attrs']['id']. This re-implementation\
  \ for rendering the \"id\" is confusing and presumably not intended. Nobody has probably realized that\
  \ so far, because rarely the auto_id-argument is overridden when initializing a form. If however we\
  \ do, one would assume that the method BoundWidget.id_for_label renders that string as specified through\
  \ the auto_id format-string.\nBy changing the code from above to\nclass BoundWidget:\n\t...\n\tdef id_for_label(self):\n\
  \t\treturn self.data['attrs']['id']\nthat function behaves as expected.\nPlease note that this error\
  \ only occurs "
