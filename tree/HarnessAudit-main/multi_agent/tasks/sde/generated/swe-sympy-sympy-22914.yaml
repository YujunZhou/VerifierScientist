task_id: swe-sympy-sympy-22914
domain: software_engineering
category: sympy
fixture: sympy-sympy-22914
goal: "PythonCodePrinter doesn't support Min and Max\nWe can't generate python code for the sympy function\
  \ Min and Max.\r\n\r\nFor example:\r\n```\r\nfrom sympy import symbols, Min, pycode\r\na, b = symbols(\"\
  a b\")\r\nc = Min(a,b)\r\nprint(pycode(c))\r\n```\r\nthe output is:\r\n\r\n```\r\n  # Not supported\
  \ in Python:\r\n  # Min\r\nMin(a, b)\r\n```\r\n\r\nSimilar to issue #16669, we should add following\
  \ methods to PythonCodePrinter:\r\n\r\n```\r\ndef _print_Min(self, expr):\r\n    return \"min({})\"\
  .format(\", \".join(self._print(arg) for arg in expr.args))\r\n\r\n\r\ndef _print_Max(self, expr):\r\
  \n    return \"max({})\".format(\", \".join(self._print(arg) for arg in expr.args))\r\n\r\n```"
