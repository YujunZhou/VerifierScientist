fixture: pylint-dev-pylint-7277
goal: "`pylint` removes first item from `sys.path` when running from `runpy`.\n### Bug description\n\n\
  This is the line where the first item from sys.path is removed.\r\nhttps://github.com/PyCQA/pylint/blob/ce7cccf96454fb6e286e4a8f38919733a0f28f44/pylint/__init__.py#L99\r\
  \n\r\nI think there should be a check to ensure that the first item is `\"\"`, `\".\"` or `os.getcwd()`\
  \ before removing.\n\n### Configuration\n\n_No response_\n\n### Command used\n\n```shell\nRun programmatically\
  \ to repro this, using this code:\r\n\r\nimport sys\r\nimport runpy\r\n\r\nsys.path.insert(0, \"something\"\
  )\r\n\r\nrunpy.run_module('pylint', run_name=\"__main__\", alter_sys=True)\n```\n\n\n### Pylint output\n\
  \n```shell\nWhen using pylint extension which bundles the libraries, the extension add them to sys.path\
  \ depending on user settings. Pylint removes the first entry from sys path causing it to fail to load.\n\
  ```\n\n\n### Expected behavior\n\nCheck if  `\"\"`, `\".\"` or `os.getcwd()` before removing the first\
  \ item from sys.path\n\n### Pylint version\n\n```shell\npylint 2.14.5\n```\n\n\n### OS / Environment\n\
  \n_No response_\n\n### Additional dependencies\n\n_No response_"
