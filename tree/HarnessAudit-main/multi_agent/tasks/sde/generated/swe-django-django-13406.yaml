goal: "Queryset with values()/values_list() crashes when recreated from a pickled query.\nDescription\n\
  \t\nI am pickling query objects (queryset.query) for later re-evaluation as per ​https://docs.djangoproject.com/en/2.2/ref/models/querysets/#pickling-querysets.\
  \ However, when I tried to rerun a query that combines values and annotate for a GROUP BY functionality,\
  \ the result is broken.\nNormally, the result of the query is and should be a list of dicts, but in\
  \ this case instances of the model are returned, but their internal state is broken and it is impossible\
  \ to even access their .id because of a AttributeError: 'NoneType' object has no attribute 'attname'\
  \ error.\nI created a minimum reproducible example.\nmodels.py\nfrom django.db import models\nclass\
  \ Toy(models.Model):\n\tname = models.CharField(max_length=16)\n\tmaterial = models.CharField(max_length=16)\n\
  \tprice = models.PositiveIntegerField()\ncrashing code\nimport pickle\nfrom django.db.models import\
  \ Sum\nfrom django_error2.models import Toy\nToy.objects.create(name='foo', price=10, material='wood')\n\
  Toy.objects.create(name='bar', price=20, material='plastic')\nToy.objects.create(name='baz', price=100,\
  \ material='wood')\nprices = Toy.objects.values('material').annotate(total_price=Sum('price'))\nprint(prices)\n\
  print(type(prices[0]))\nprices2 = Toy.objects.all()\nprices2.query = pickle.loads(pickle.dumps(prices.query))\n\
  print(type(prices2[0]))\nprint(prices2)\nThe type of prices[0] is reported as 'dict', which is ok, the\
  \ type of prices2[0] is reported as '"
