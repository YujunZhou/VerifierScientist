fixture: mwaskom-seaborn-3187
goal: "Wrong legend values of large ranges\nAs of 0.12.1, legends describing large numbers that were created\
  \ using `ScalarFormatter` with an offset are formatted without their multiplicative offset value. An\
  \ example:\r\n```python\r\nimport seaborn as sns\r\nimport seaborn.objects as so\r\n\r\npenguins = sns.load_dataset(\"\
  Penguins\")\r\npenguins[\"body_mass_mg\"] = penguins[\"body_mass_g\"]*1000\r\n(\r\n    so.Plot(\r\n\
  \        penguins, x=\"bill_length_mm\", y=\"bill_depth_mm\",\r\n        color=\"species\", pointsize=\"\
  body_mass_mg\",\r\n    )\r\n    .add(so.Dot())\r\n)\r\n```\r\nThe code creates the following plot:\r\
  \n![image](https://user-images.githubusercontent.com/13831112/205512305-778966db-f8d8-43f3-a2c0-5e5ce95bae39.png)\r\
  \nwhich is wrong because `body_mass_mg` is in the order of 1E6. The issue also reproduces if you create\
  \ the mentioned plot using `scatterplot`.\r\n \r\nI believe the issue stems from not using the offset\
  \ value of the `ScalarFormatter` used to generate the tick labels:\r\nhttps://github.com/mwaskom/seaborn/blob/ba786bc14eb255f6b4fb7619c8210c5a8016a26f/seaborn/_core/scales.py#L377-L382\r\
  \nExamining the code of `ScalarFormatter` suggests the issue also depends on the following rcParam settings:\r\
  \n`mpl.rcParams['axes.formatter.useoffset']`\r\n`mpl.rcParams['axes.formatter.offset_threshold']`\r\n\
  However, I did not test it. \r\n\r\nThe offset value can be safely retrieved from all formatters and\
  \ based on that it can be used to create the legend title and/or labels."
