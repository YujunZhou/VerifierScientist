  \ {xds1.a}, a2: {xds2.a}, a3: {xds3.a}\") # <-- notice how the value of a1 changes\r\na1: d, a2: c,\
  \ a3: d\r\n```\r\n\r\n**Anything else we need to know?**:\r\nI believe the issue is with the line for\
