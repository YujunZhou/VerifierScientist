task_id: swe-pylint-dev-pylint-6903
domain: software_engineering
category: pylint
fixture: pylint-dev-pylint-6903
goal: "Running pylint in Kubernetes Pod with --jobs=0 fails\n### Bug description\n\nI run pylint in multiple\
  \ parallel stages with Jenkins at a Kubernets agent with `--jobs=0`. \r\n\r\nThe newly introduced function\
  \ [pylint.run._query_cpu()](https://github.com/PyCQA/pylint/blob/main/pylint/lint/run.py#L34) is called\
  \ to determine the number of cpus to use and returns 0 in this case.\r\n\r\nThis leads to a crash of\
  \ pylint because the multiprocessing needs a value > 0.\r\n\r\nI checked the function and found out\
  \ the following values from the files that are read in above mentioned function:\r\n\r\n> cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us\r\
  \n> \\> -1\r\n> cat /sys/fs/cgroup/cpu/cpu.cfs_period_us\r\n> \\> 100000\r\n> cat /sys/fs/cgroup/cpu/cpu.shares\r\
  \n> \\> 2\r\n\r\nThis leads to the calculation `2/1024` then in line https://github.com/PyCQA/pylint/blob/main/pylint/lint/run.py#L60\
  \ which is cast to an `int` and therefore 0 then. \n\n### Configuration\n\n_No response_\n\n### Command\
  \ used\n\n```shell\npylint --msg-template \"{path}:{module}:{line}: [{msg_id}({symbol}), {obj}] {msg}\"\
  \ --exit-zero --jobs 0 --verbose my_package\n```\n\n\n### Pylint output\n\n```shell\n> [2022-06-09T13:38:24.824Z]\
  \   File \"/usr/local/lib/python3.9/dist-packages/pylint/lint/run.py\", line 197, in __init__\r\n> [2022-06-09T13:38:24.824Z]\
  \     linter.check(args)\r\n> [2022-06-09T13:38:24.824Z]   File \"/usr/local/lib/python3.9/dist-packages/pylint/lint/pylinter.py\"\
  , line 650, in check\r\n> [2022-06-09T13:38:24.824Z]     check_parallel(\r\n> [2022-06-09T13:38:24.824Z]\
  \   File \"/us"
