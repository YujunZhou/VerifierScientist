fixture: django-django-16429
goal: "timesince() raises TypeError with USE_TZ=True and >1 month interval.\nDescription\n\t \n\t\t(last\
  \ modified by Sage Abdullah)\n\t \nAs of 8d67e16493c903adc9d049141028bc0fff43f8c8, calling timesince()\
  \ with a datetime object that's one month (or more) in the past and the USE_TZ setting is set to True\
  \ results in the following crash:\nTypeError: can't subtract offset-naive and offset-aware datetimes\n\
  Test:\n...\nclass TimesinceTests(TestCase):\n\t...\n\t@requires_tz_support\n\t@override_settings(USE_TZ=True)\n\
  \tdef test_long_interval_with_tz(self):\n\t\tnow = timezone.now()\n\t\td = now - datetime.timedelta(days=31)\n\
  \t\tself.assertEqual(timesince(d), \"1\\xa0month\")\nI believe this is because the pivot instantiated\
  \ here: ​https://github.com/django/django/blob/d2310f6473593d28c14b63a72253408b568e100a/django/utils/timesince.py#L93-L100\
  \ does not take into account the datetime object's tzinfo. Adding 0, d.tzinfo arguments to the datetime.datetime\
  \ call seems to fix this.\nHappy to send a PR."
