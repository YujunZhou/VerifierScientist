  \ of the bug or suggestion\r\n\r\nException when youtube-dl logs to pytest captured output. Youtube-dl\
  \ looks for `b` in `out.mode` to decide whether to writes `bytes` or `str`. `_pytest.capture.EncodedFile`\
  \ incorrectly advertises `rb+`, the mode of the underlying stream. Its `write()` method raises an exception\
  \ when passed `bytes`.\r\n\r\n```\r\n(pytest-issue-ve3) 01:11:48:nlevitt@Internets-Air-2:/tmp$ py.test\
  \ test.py \r\n============================================================================== test session\
