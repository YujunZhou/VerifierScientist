  \ darwin -- Python 3.7.3, pytest-4.5.0, py-1.8.0, pluggy-0.11.0\r\nrootdir: /private/tmp\r\ncollected\
  \ 1 item                                                                                           \
  \                                                                      \r\n\r\ntest.py F           \
  \                                                                                                  \
  \                                                     [100%]\r\n\r\n====================================================================================\
  \ FAILURES ====================================================================================\r\n\
  __________________________________________________________________________________"
agents:
