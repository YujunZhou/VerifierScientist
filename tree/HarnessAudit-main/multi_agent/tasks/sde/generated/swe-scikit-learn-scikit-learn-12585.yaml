fixture: scikit-learn-scikit-learn-12585
goal: "clone fails for parameters that are estimator types\n#### Description\r\n\r\n`clone` fails when\
  \ one or more instance parameters are estimator types (i.e. not instances, but classes). \r\n\r\nI know\
  \ this is a somewhat unusual use case, but I'm working on a project that provides wrappers for sklearn\
  \ estimators (https://github.com/phausamann/sklearn-xarray) and I'd like to store the wrapped estimators\
  \ as their classes - not their instances - as a parameter inside of a wrapper that behaves like an estimator\
  \ itself. \r\n\r\n#### Steps/Code to Reproduce\r\n\r\n    from sklearn.preprocessing import StandardScaler\r\
  \n    from sklearn.base import clone\r\n    clone(StandardScaler(with_mean=StandardScaler))\r\n\r\n\
  #### Expected Results\r\n\r\nNo error.\r\n\r\n#### Actual Results\r\n```\r\nTraceback (most recent call\
  \ last):\r\n...\r\n  File \"...\\lib\\site-packages\\sklearn\\base.py\", line 62, in clone\r\n    new_object_params[name]\
  \ = clone(param, safe=False)\r\n  File \"...\\lib\\site-packages\\sklearn\\base.py\", line 60, in clone\r\
  \n    new_object_params = estimator.get_params(deep=False)\r\nTypeError: get_params() missing 1 required\
  \ positional argument: 'self'\r\n```\r\n\r\n#### Possible fix\r\n\r\nChange `base.py`, line 51 to: \r\
  \n\r\n    elif not hasattr(estimator, 'get_params') or isinstance(estimator, type):\r\n\r\nI'm not sure\
  \ whether this might break stuff in other places, however. I'd happily submit a PR if this change is\
  \ desired.\r\n\r\n#### Versions\r\n\r\n    sklearn: 0.20.0"
