fixture: mwaskom-seaborn-3069
goal: "Nominal scale should be drawn the same way as categorical scales\nThree distinctive things happen\
  \ on the categorical axis in seaborn's categorical plots:\r\n\r\n1. The scale is drawn to +/- 0.5 from\
  \ the first and last tick, rather than using the normal margin logic\r\n2. A grid is not shown, even\
  \ when it otherwise would be with the active style\r\n3. If on the y axis, the axis is inverted\r\n\r\
  \nIt probably makes sense to have `so.Nominal` scales (including inferred ones) do this too. Some comments\
  \ on implementation:\r\n\r\n1. This is actually trickier than you'd think; I may have posted an issue\
  \ over in matplotlib about this at one point, or just discussed on their gitter. I believe the suggested\
  \ approach is to add an invisible artist with sticky edges and set the margin to 0. Feels like a hack!\
  \ I might have looked into setting the sticky edges _on the spine artist_ at one point?\r\n\r\n2. Probably\
  \ straightforward to do in `Plotter._finalize_figure`. Always a good idea? How do we defer to the theme\
  \ if the user wants to force a grid? Should the grid be something that is set in the scale object itself\r\
  \n\r\n3. Probably straightforward to implement but I am not exactly sure where would be best."
