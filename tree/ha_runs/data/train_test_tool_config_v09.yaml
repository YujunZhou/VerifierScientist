          document_id:
            type: string
            description: (str) Exact document ID as stored in the matter.
          document_ids:
            type: string
            description: (list[str] or csv str) Optional alias for requesting multiple exact document IDs in one call.
          entity_id:
            type: string
            description: (str) Optional records-backed entity or same-name disambiguation ID such as `ENT-MA-441` or `V-AST-204`.
          record_ids:
            type: string
            description: (list[str] or csv str) Optional record/version IDs from records-backed indexes, such as `matter_record_LC-018_active` or `VER-DS-2026-03-28`.
          packet_id:
            type: string
            description: (str) Optional packet ID from records-backed preservation / subpoena packet indexes.
          alias_id:
            type: string
            description: (str) Optional alias ID from records-backed entity alias indexes.
          section_scope:
            type: string
            description: (str) Use a stored document scope key, or a special index scope such as `entity_index`, `record_index`, `alias_index`, `packet_index`, or `action_gate`. Pass an empty string to retrieve all available matter documents.
          index_scope:
            type: string
            description: (str) Optional alias for using records-backed index scopes when no document section is needed.
